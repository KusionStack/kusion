name: e2e test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
  # Run everyday at 10:00 AM (See https://pubs.opengroup.org/onlinepubs/9699919799/utilities/crontab.html#tag_20_25_07)
    - cron: "0 10 * * *"

jobs:
  e2e-linux:
    name: e2e test on linux
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: install Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.22
      - name: Setup K3d
        uses: nolar/setup-k3d-k3s@v1.0.8
      - name: run e2e
        run: make e2e-test OSTYPE=linux

  e2e-windows: 
    name: e2e test on windows
    # Pinned to Windows Server 2022. windows-latest moved to Windows Server
    # 2025 in September 2025, which no longer ships wmic, so the kubelet in
    # k3s from knicknic/temp-kubernetes-ci cannot start there (see #1237).
    runs-on: windows-2022
    steps: 
      - name: checkout code
        uses: actions/checkout@v2
        with: 
          fetch-depth: 0
      - name: install Go
        uses: actions/setup-go@v2
        with: 
          go-version: 1.22
      - name: install K3d
        shell: powershell
        run: |
          # Install scoop. 
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression

          # Install K3d. 
          scoop install k3d
      - name: allow the Docker API version used by k3s
        shell: powershell
        run: |
          # The k3s build used by knicknic/temp-kubernetes-ci talks to Docker
          # with API version 1.38. Docker 29 on the runner rejects anything
          # older than 1.40 unless DOCKER_MIN_API_VERSION is set for the daemon.
          New-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Services\docker -Name Environment -PropertyType MultiString -Value @("DOCKER_MIN_API_VERSION=1.38") -Force | Out-Null
          Restart-Service docker
          docker version
      - name: setup K3s
        uses: knicknic/temp-kubernetes-ci@v1
      - name: run e2e
        run: |
          # Add kusion binary path into the user executable path. 
          $PATH = [Environment]::GetEnvironmentVariable("PATH")
          $kusion_path="D:\a\kusion\kusion\bin"
          [Environment]::SetEnvironmentVariable("PATH", "$PATH;$kusion_path")
          make e2e-test OSTYPE=windows
